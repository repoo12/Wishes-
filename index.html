    <script>
        /* JavaScript Functionality */
        
        // Content for Sharing
        const SHARE_TITLE = 'Happy Diwali! ✨';
        const SHARE_TEXT = '✨तिमी र तिम्रो परिवारलाई दीपावलीको धेरे धेरे शुभकामना!✨';
        const SHARE_URL = window.location.href; 
        
        // Helper function for copy to clipboard
        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            textArea.style.opacity = 0; 
            document.body.appendChild(textArea);
            
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                document.body.removeChild(textArea);
                return true;
            } catch (err) {
                document.body.removeChild(textArea);
                return false;
            }
        }

        // Common Share Handler Function for 22k and Instagram buttons
        async function handleNativeShare(e) {
            e.preventDefault();
            
            const shareData = {
                title: SHARE_TITLE,
                text: SHARE_TEXT,
                url: SHARE_URL 
            };
            
            const fallbackMessage = `${SHARE_TITLE}\n${SHARE_TEXT}\n\nLink: ${SHARE_URL}`;

            if (navigator.share) {
                // Attempt to use native Web Share API
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    // If native share fails or cancelled, try copy to clipboard
                    if (copyToClipboard(fallbackMessage)) {
                         alert('Native Share failed. Message and link copied to clipboard! Paste it into your favorite app.');
                    } else {
                         alert('Native Share failed. Please manually copy this link: ' + SHARE_URL);
                    }
                }
            } else {
                // Fallback for non-supporting browsers
                if (copyToClipboard(fallbackMessage)) {
                     alert('Native Share not supported here. Message and link copied to clipboard! Paste it into your favorite app.');
                } else {
                     alert('Native Share not supported. Please manually copy this link: ' + SHARE_URL);
                }
            }
        }


        // 1. Share Links Implementation 

        document.getElementById('share-facebook').addEventListener('click', (e) => {
            e.preventDefault();
            const facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(SHARE_URL)}`;
            window.open(facebookUrl, '_blank', 'width=600,height=400');
        });

        document.getElementById('share-whatsapp').addEventListener('click', (e) => {
            e.preventDefault();
            const whatsappText = `${SHARE_TEXT} - ${SHARE_URL}`;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(whatsappText)}`;
            window.open(whatsappUrl, '_blank');
        });

        // Event Listener for the 22k Share Button
        document.getElementById('mainShareButton').addEventListener('click', handleNativeShare); 

        // Event Listener for the Instagram Share Button
        document.getElementById('share-instagram').addEventListener('click', handleNativeShare);


        // 2. Simple Fireworks Effect (Canvas-based) - 4X Increase
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let running = true;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Particle Class (A simple structure for a firework spark)
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * (Math.random() * 8), 
                    y: (Math.random() - 0.5) * (Math.random() * 8)
                };
                this.alpha = 1;
                this.friction = 0.98;
                this.gravity = 0.08;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false); 
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.015; 
                this.draw();
            }
        }
        
        // Function to create an explosion (a single firework burst)
        function createExplosion(x, y, count) {
            const colors = ['#FFD700', '#FF8C00', '#FF4500', '#FFA07A', '#FFFFFF', '#00FFFF', '#FF00FF'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        // Animation Loop
        function animate() {
            if (!running) return;
            requestAnimationFrame(animate);
            // Clear canvas with high transparency for a subtle background firework trail
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                if (particle.alpha <= 0 || particle.radius < 0.5) {
                    particles.splice(index, 1);
                } else {
                    particle.update();
                }
            });
        }

        // Trigger fireworks on page load
        function launchFireworks(count, interval) {
            let explosions = 0;
            const launchInterval = setInterval(() => {
                if (explosions >= count) {
                    clearInterval(launchInterval);
                    return;
                }
                const x = Math.random() * canvas.width;
                const y = canvas.height * (0.3 + Math.random() * 0.7); 
                createExplosion(x, y, 70 + Math.floor(Math.random() * 80)); 
                explosions++;
            }, interval);
        }

        // Start the animation loop
        animate();
        
        // Initial fireworks burst: 20 explosions over 300ms intervals (4X effect)
        launchFireworks(20, 300);

    </script>
